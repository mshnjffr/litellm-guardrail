# The guardrail's Python source, mounted into LiteLLM next to its config.yaml.
# Pass it with: --set-file guardrailCode=guardrail/pii_guardrail.py
guardrailCode: ""

piiService:
  image:
    repository: pii-service
    tag: 0.1.0
    pullPolicy: IfNotPresent  # built locally, see scripts/deploy.sh
  replicas: 1
  # What to do with a prompt containing PII: block it (HTTP 400), or mask the
  # PII and send the rest on (jane@example.com becomes <EMAIL_ADDRESS>). Masking
  # suits chat clients, which resend the whole conversation every turn: a
  # blocked message blocks every later turn too, until the chat is cleared.
  # Responses containing PII are always blocked.
  promptAction: block
  # Detection settings. Every Presidio entity type counts as PII, except those
  # ignored below.
  scoreThreshold: 0.4         # Presidio confidence needed to count as PII (0-1)
  # Entity types that are never masked or blocked. DATE_TIME isn't PII on its
  # own, and model reasoning almost always contains one ("today", "a moment"),
  # so it would block most responses.
  ignoredEntities: [DATE_TIME]
  # Entity types that count in prompts but don't block responses. Names,
  # places and nationalities in an answer are almost always public knowledge
  # ("Lord Rayleigh", "Earth"), and blocking them blocks most ordinary answers.
  responseIgnoredEntities: [PERSON, LOCATION, NRP]
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  # For clusters running the Prometheus Operator. Pods are also annotated with
  # prometheus.io/scrape for annotation-based scraping.
  serviceMonitor:
    enabled: false
    interval: 30s

# A small Prometheus that scrapes LiteLLM and the PII service. Open its UI with:
#   kubectl -n litellm port-forward svc/prometheus 9090:9090
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v3.15.0
  scrapeInterval: 15s
  retention: 1d   # data is kept in the pod only, and resets when it restarts
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Values for the official LiteLLM chart (oci://docker.litellm.ai/berriai/litellm-helm).
litellm:
  fullnameOverride: litellm
  image:
    repository: docker.litellm.ai/berriai/litellm
    tag: v1.105.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
  proxy_config:
    model_list:
      - model_name: deepseek-r1:8b
        litellm_params:
          model: ollama/deepseek-r1:8b
          api_base: http://host.docker.internal:11434  # Ollama on the host machine
          # Moves streamed reasoning into the response content, where
          # pii-response-guardrail scans it. Without this, streamed reasoning isn't checked.
          merge_reasoning_content_in_choices: true
    # PIIGuardrail is registered twice, once per hook, rather than once with
    # mode [pre_call, post_call]. LiteLLM logs a guardrail's configured mode, so
    # with both modes every run is shown as both pre-call and post-call in the
    # UI's logs, and its compliance checks find no pre-call screening.
    guardrails:
      - guardrail_name: pii-prompt-guardrail
        litellm_params:
          guardrail: pii_guardrail.PIIGuardrail
          mode: pre_call     # mask PII in the prompt
          default_on: true   # apply to every request
          api_base: http://pii-service:8000
      - guardrail_name: pii-response-guardrail
        litellm_params:
          guardrail: pii_guardrail.PIIGuardrail
          mode: post_call    # block PII in the model response
          default_on: true
          api_base: http://pii-service:8000
      # Reasoning models return their reasoning separately from the response
      # content, and LiteLLM doesn't pass it to pii-response-guardrail.
      - guardrail_name: pii-reasoning-guardrail
        litellm_params:
          guardrail: pii_guardrail.PIIReasoningGuardrail
          mode: post_call
          default_on: true
          api_base: http://pii-service:8000
    litellm_settings:
      # Prometheus metrics at /metrics/, including litellm_guardrail_* for both guardrails.
      callbacks: ["prometheus"]
      # Lets Prometheus scrape without the master key. The gateway is only
      # reachable inside the cluster or through port-forward; keep
      # authentication on if it's ever exposed further.
      require_auth_for_metrics_endpoint: false
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
  # For annotation-based Prometheus scraping, like the PII service's pods.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
    prometheus.io/path: /metrics/
  # LiteLLM loads guardrail modules from the directory its config.yaml is in.
  volumes:
    - name: guardrail-code
      configMap:
        name: litellm-guardrail-code
  volumeMounts:
    - name: guardrail-code
      mountPath: /etc/litellm/pii_guardrail.py
      subPath: pii_guardrail.py
