# The PII service. The name is fixed because the guardrail's api_base in
# values.yaml (http://pii-service:8000) refers to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pii-service
  labels:
    {{- include "piiService.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.piiService.replicas }}
  selector:
    matchLabels:
      {{- include "piiService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "piiService.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: pii-service
          image: "{{ .Values.piiService.image.repository }}:{{ .Values.piiService.image.tag }}"
          imagePullPolicy: {{ .Values.piiService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PII_SCORE_THRESHOLD
              value: {{ .Values.piiService.scoreThreshold | quote }}
            - name: PII_IGNORED_ENTITIES
              value: {{ join "," .Values.piiService.ignoredEntities | quote }}
            - name: PII_RESPONSE_IGNORED_ENTITIES
              value: {{ join "," .Values.piiService.responseIgnoredEntities | quote }}
          # The service only answers once the spaCy model has loaded.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.piiService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pii-service
  labels:
    {{- include "piiService.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "piiService.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
