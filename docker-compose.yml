# LiteLLM gateway with the custom PII guardrails, plus a Postgres database for
# virtual keys, spend logs and guardrail logs. The model runs in Ollama on the
# host machine. Everything listens on this machine only.
#
#   printf 'LITELLM_MASTER_KEY=sk-%s\nLITELLM_SALT_KEY=sk-%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
#   docker compose up -d

services:
  litellm:
    # Pinned: the guardrails are tested against this release.
    image: docker.litellm.ai/berriai/litellm:v1.105.1
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set it in .env - see README.md}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set it in .env - see README.md}
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    # The repo is mounted (not single files) so edits are picked up on restart.
    # LiteLLM loads pii_guardrail.py from the directory config.yaml is in.
    volumes:
      - ./:/app/custom:ro
    command: ["--config", "/app/custom/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the container reach Ollama on Linux too
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
